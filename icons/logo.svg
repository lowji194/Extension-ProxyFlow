<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pf-bg" x1="8%" y1="6%" x2="92%" y2="94%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="pf-glow" cx="26%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="pf-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#pf-bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#pf-glow)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Lower Direct branch (grouped so path and node share uniform translucency without overlap seam) -->
  <g opacity="0.82">
    <path d="M 32 64 C 50 64, 52 88, 70 88 L 91 88" fill="none" stroke="#FFFFFF" stroke-width="10.5" stroke-linecap="round"/>
    <circle cx="91" cy="88" r="10" fill="#FFFFFF"/>
    <circle cx="91" cy="88" r="4.2" fill="#5B21B6"/>
  </g>

  <!-- Upper Proxy branch (highlighted active flow) -->
  <path d="M 32 64 C 50 64, 52 40, 70 40 L 91 40" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" filter="url(#pf-shadow)"/>

  <!-- Ingress Source Node -->
  <circle cx="32" cy="64" r="11" fill="#FFFFFF" filter="url(#pf-shadow)"/>
  <circle cx="32" cy="64" r="4.8" fill="#2563EB"/>

  <!-- Live Proxy Target Node -->
  <circle cx="91" cy="40" r="14.5" fill="#FFFFFF" filter="url(#pf-shadow)"/>
  <circle cx="91" cy="40" r="8.2" fill="#10B981"/>
</svg>
